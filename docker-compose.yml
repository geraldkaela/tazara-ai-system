version: '3.8'

services:
  # Main API service
  api:
    build: .
    container_name: tazara-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://tazara:tazara123@db:5432/tazara_multi_route
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=tazara-ai-secret-key-change-in-production
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
    volumes:
      - ./logs:/app/logs
      - ./reinforcement_rl:/app/reinforcement_rl
    restart: unless-stopped
    networks:
      - tazara-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: tazara-db
    environment:
      - POSTGRES_DB=tazara_multi_route
      - POSTGRES_USER=tazara
      - POSTGRES_PASSWORD=tazara123
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - tazara-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tazara"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tazara-redis
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - tazara-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: tazara-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./dashboard/static:/usr/share/nginx/html
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - tazara-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: tazara-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - tazara-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: tazara-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - tazara-network

  # Redis Commander (Redis GUI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: tazara-redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis123
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - tazara-network

  # Celery Worker (for background tasks)
  celery-worker:
    build: .
    container_name: tazara-celery-worker
    command: celery -A api.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://tazara:tazara123@db:5432/tazara_multi_route
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=tazara-ai-secret-key-change-in-production
    depends_on:
      - db
      - redis
    volumes:
      - ./logs:/app/logs
      - ./reinforcement_rl:/app/reinforcement_rl
    restart: unless-stopped
    networks:
      - tazara-network

  # Celery Beat (scheduler)
  celery-beat:
    build: .
    container_name: tazara-celery-beat
    command: celery -A api.celery beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://tazara:tazara123@db:5432/tazara_multi_route
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=tazara-ai-secret-key-change-in-production
    depends_on:
      - db
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - tazara-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  tazara-network:
    driver: bridge
